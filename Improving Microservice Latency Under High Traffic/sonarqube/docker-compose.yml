services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      # If port 9000 is blocked/on use, override:
      # - PowerShell: $env:SONAR_HOST_PORT=9001
      # - CMD:        set SONAR_HOST_PORT=9001
      - "${SONAR_HOST_PORT:-9000}:9000"
    environment:
      # Local/dev convenience. If you prefer strict checks, remove this and follow the vm.max_map_count troubleshooting note.
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:


